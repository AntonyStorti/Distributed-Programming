<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettagli del Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Gestisci Profilo Ristorante</h1>
        <form action="{{ url_for('restaurant.view_profile', restaurant_id=restaurant.id) }}" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Nome del Ristorante:</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ restaurant.name }}" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Indirizzo:</label>
                <input type="text" id="address" name="address" class="form-control" value="{{ restaurant.address }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Telefono:</label>
                <input type="text" id="phone" name="phone" class="form-control" value="{{ restaurant.phone_number or '' }}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ restaurant.email or '' }}">
            </div>
            <div class="mb-3">
                <label for="hours" class="form-label">Orari di Apertura e Chiusura (JSON):</label>
                <textarea id="hours" name="hours" class="form-control">{{ restaurant.opening_hours or '' }}</textarea>
                <small class="form-text text-muted">Formato: {"lunedi": {"apertura": "08:00", "chiusura": "22:00"}, "martedi": {...}}</small>
            </div>
            <div class="mb-3">
                <label for="is_open" class="form-label">È Aperto:</label>
                <select id="is_open" name="is_open" class="form-select">
                    <option value="1" {% if restaurant.is_open %}selected{% endif %}>Sì</option>
                    <option value="0" {% if not restaurant.is_open %}selected{% endif %}>No</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descrizione:</label>
                <textarea id="description" name="description" class="form-control">{{ restaurant.description or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label for="logo_url" class="form-label">URL Logo:</label>
                <input type="text" id="logo_url" name="logo_url" class="form-control" value="{{ restaurant.logo_url or '' }}">
                {% if restaurant.logo_url %}
                    <div class="mt-3">
                        <img src="{{ restaurant.logo_url }}" alt="Logo del Ristorante" class="img-fluid" style="max-width: 150px;">
                    </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Salva Modifiche</button>
        </form>

        <!-- Pulsanti per il logout e tornare alla dashboard -->
        <div class="text-center mt-4">
            <a href="{{ url_for('auth.restaurant_dashboard') }}" class="btn btn-secondary py-2 px-5 me-2">Torna alla Dashboard</a>
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
