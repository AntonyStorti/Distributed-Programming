<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Piatto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Food Delivery</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Cerca Piatto</h1>

        <form method="POST" action="{{ url_for('customer.search_foods', user_id=user.id) }}">
            <div class="input-group mb-4">
                <input type="text" class="form-control" placeholder="Cerca un piatto..." name="search_query">
                <button class="btn btn-outline-secondary" type="submit">Cerca</button>
            </div>
        </form>

        <div class="row">
            {% for food in foods %}
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">{{ food.name }}</h5>
                            <p class="card-text">{{ food.description }}</p>
                            <p class="card-text"><strong>Prezzo:</strong> €{{ food.price }}</p>
                            <!-- Aggiungi al carrello -->
                            <form method="POST" action="{{ url_for('customer.add_to_cart', user_id=user.id, item_id=food.id) }}">
                                <input type="hidden" name="food_id" value="{{ food.id }}">
                                <button type="submit" class="btn btn-primary">Aggiungi al Carrello</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Pulsante per tornare alla pagina dei ristoranti e menu -->
        <div class="text-center mt-4">
            <a href="{{ url_for('customer.browse', user_id=user.id) }}" class="btn btn-secondary">Torna ai Ristoranti e Menu</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
