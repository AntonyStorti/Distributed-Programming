<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Amministratore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5 text-center">
        <h1 class="mb-4">Dashboard Amministratore</h1>
        <p class="mb-5">Benvenuto, {{ user.name }}! Seleziona una delle opzioni seguenti per gestire il sistema.</p>

        <div class="d-flex justify-content-center">
            <div class="btn-group" role="group" aria-label="Opzioni Dashboard">
                <a href="{{ url_for('admin.manage_accounts') }}" class="btn btn-primary btn-lg mx-2">
                    Gestione Account
                </a>
                <a href="{{ url_for('admin.monitor_performance') }}" class="btn btn-success btn-lg mx-2">
                    Monitoraggio Performance e Statistiche
                </a>
            </div>
        </div>

        <div class="mt-5">
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
