<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richieste di Consegna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Richieste di Consegna</h1>
        <div id="loading-spinner" class="text-center" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Caricamento...</span>
            </div>
            <p>Caricamento delle richieste...</p>
        </div>
        <div id="requests-list" class="list-group">
            <!-- Le richieste saranno caricate dinamicamente con JavaScript -->
        </div>
         <!-- Pulsante per il logout -->
        <div class="text-center mt-4">
            <a href="{{ url_for('auth.rider_dashboard') }}" class="btn btn-secondary py-2 px-5 ms-2">Torna alla Dashboard</a>
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <!-- JS personalizzato -->
    <script src="{{ url_for('static', filename='js/rider_delivery_requests.js') }}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
