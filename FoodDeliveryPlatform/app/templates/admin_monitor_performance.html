<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Monitoraggio Performance</h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Consegne Completate Totali</h5>
                        <p class="card-text display-5">{{ total_completed_deliveries }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Ordini Totali</h5>
                        <p class="card-text display-5">{{ total_orders }}</p>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-center mb-4">Ordini per Ristorante</h2>
        <canvas id="ordersChart" width="400" height="200"></canvas>

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.admin_dashboard') }}" class="btn btn-secondary">Torna alla Dashboard</a>
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <!-- Passa le variabili come oggetti JSON a JavaScript -->
    <script>
        var restaurantNames = {{ restaurant_orders|map(attribute='name')|list|tojson }};
        var orderCounts = {{ restaurant_orders|map(attribute='total_orders')|list|tojson }};
    </script>

    <!-- Collega il file JavaScript -->
    <script src="{{ url_for('static', filename='js/admin_monitor_performance.js') }}"></script>
</body>
</html>
