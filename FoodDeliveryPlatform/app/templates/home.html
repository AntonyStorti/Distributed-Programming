<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleziona il Tuo Ruolo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
    <header class="bg-dark text-white p-3">
        <h1 class="m-0">Benvenuto alla Piattaforma di Food Delivery!</h1>
    </header>

    <main class="container mt-5">
        <form id="roleForm" action="{{ url_for('home.redirect_user') }}" method="post" class="form-group">
            <label for="role" class="form-label">Seleziona il tuo ruolo:</label>
            <select id="role" name="role" class="form-select" required>
                <option value="" disabled selected>Seleziona un ruolo</option>
                <option value="restaurant">Ristorante</option>
                <option value="rider">Rider</option>
                <option value="customer">Cliente</option>
                <option value="admin">Amministratore</option>
            </select>

            <!-- Campo per inserire l'ID del ristorante (visualizzato solo se 'restaurant' è selezionato) -->
            <div id="restaurant-id" class="mt-3" style="display:none;">
                <label for="restaurant_id" class="form-label">Inserisci l'ID del ristorante:</label>
                <input type="number" id="restaurant_id" name="restaurant_id" min="1" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary mt-3">Continua</button>
        </form>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Collega il file JavaScript -->
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
