<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-3 text-center">
        <h1 class="m-0">Benvenuto nella Piattaforma di Food Delivery</h1>
    </header>

    <main class="container mt-5">
        <!-- Mostra i messaggi flash -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-warning">
                    <ul class="mb-0">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        {% endwith %}

        <!-- Form login stretto -->
        <form method="POST" class="bg-white p-4 rounded shadow-sm w-50 mx-auto">
            <div class="mb-3">
                <label for="username" class="form-label">Nome utente</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <!-- Passa il restaurant_id se presente nella query string -->
            <input type="hidden" id="restaurant_id" name="restaurant_id" value="{{ request.args.get('restaurant_id') }}">

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-3">
            <!-- Link per la registrazione -->
            <a href="{{ url_for('auth.register') }}" id="register-link" class="btn btn-link">Registrati</a>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Collega il file JavaScript -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
