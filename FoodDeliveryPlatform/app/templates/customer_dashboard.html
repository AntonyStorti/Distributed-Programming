<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cliente</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Food Delivery</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Benvenuto nella tua Dashboard</h1>
        <div class="row mt-4">
            <!-- Pulsante 1: Visualizza e Cerca -->
            <div class="col-md-6 col-lg-3 mb-4">
                <a href="{{ url_for('customer.browse', user_id=user.id) }}" class="btn btn-primary w-100 py-3">
                    Visualizza Ristoranti e Menu
                </a>
            </div>
            <!-- Pulsante 2: Effettua Ordini -->
            <div class="col-md-6 col-lg-3 mb-4">
                <a href="{{ url_for('customer.place_order', user_id=user.id) }}" class="btn btn-success w-100 py-3">
                    Effettua e Personalizza Ordini
                </a>
            </div>
            <!-- Pulsante 3: Traccia Ordini -->
            <div class="col-md-6 col-lg-3 mb-4">
                <a href="{{ url_for('customer.track_orders', user_id=user.id) }}" class="btn btn-warning w-100 py-3">
                    Traccia Ordini
                </a>
            </div>
            <!-- Pulsante 4: Gestisci Profilo -->
            <div class="col-md-6 col-lg-3 mb-4">
                <a href="{{ url_for('customer.profile', user_id=user.id) }}" class="btn btn-info w-100 py-3">
                    Gestisci Profilo
                </a>
            </div>
        </div>
        <div class="text-center mt-4">
            <!-- Pulsante 5: Logout -->
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
