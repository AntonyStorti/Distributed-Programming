<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Piatto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-3 text-center">
        <h1 class="m-0">Modifica Piatto</h1>
        <!-- Pulsante per tornare alla dashboard -->
        <a href="{{ url_for('auth.restaurant_dashboard') }}" class="btn btn-secondary mt-2">Torna alla Dashboard</a>
        <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
    </header>

    <main class="container mt-5">
        <section id="edit-item" class="bg-white p-4 rounded shadow-sm">
            <h2>Modifica i Dettagli del Piatto</h2>
            <form id="edit-item-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Nome del Piatto:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descrizione:</label>
                    <textarea id="description" name="description" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Prezzo:</label>
                    <input type="number" id="price" name="price" class="form-control" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="available" class="form-label">Disponibile:</label>
                    <select id="available" name="available" class="form-select">
                        <option value="true">Sì</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Aggiorna Piatto</button>
            </form>
        </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS personalizzato -->
    <script src="{{ url_for('static', filename='js/restaurant_edit_item.js') }}"></script>
</body>
</html>
