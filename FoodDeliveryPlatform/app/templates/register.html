<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-dark text-white text-center py-3">
        <h1>Registrati alla Piattaforma di Food Delivery</h1>
    </header>

    <main class="container mt-5">
        <!-- Mostra i messaggi flash -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                        <li class="alert alert-warning">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="POST" class="bg-light p-4 rounded shadow-sm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome utente</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Nome</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Indirizzo</label>
                        <input type="text" class="form-control" name="address">
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Ruolo</label>
                        <select class="form-select" name="role" required>
                            <option value="restaurant">Ristorante</option>
                            <option value="rider">Rider</option>
                            <option value="customer">Cliente</option>
                            <option value="admin">Amministratore</option>
                        </select>
                    </div>

                    <!-- Aggiungi il campo nascosto per restaurant_id -->
                    {% if request.args.get('restaurant_id') %}
                        <input type="hidden" name="restaurant_id" value="{{ request.args.get('restaurant_id') }}">
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100">Registrati</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{{ url_for('auth.login', restaurant_id=request.args.get('restaurant_id')) }}" class="btn btn-link">Hai già un account? Accedi</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
