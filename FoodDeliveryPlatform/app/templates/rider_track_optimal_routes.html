<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traccia Percorso Consegna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* Mappa con altezza definita e margine top per separarla dal contenuto precedente */
        .map-container {
            height: 400px;
            width: 100%;
            display: none;  /* Mappa nascosta inizialmente */
            margin-top: 20px;  /* Margine per separarla dal contenuto precedente */
        }

        .order-item {
            display: flex;
            flex-direction: column;  /* Assicura che la mappa venga visualizzata sotto il pulsante */
            margin-bottom: 20px;  /* Aggiunge uno spazio tra gli ordini */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Ordini Tracciabili</h1>

        <div id="orders-list" class="list-group">
            <!-- La lista degli ordini verrà caricata dinamicamente con JavaScript -->
        </div>

        <!-- Pulsante per il logout -->
        <div class="text-center mt-4">
            <a href="{{ url_for('auth.rider_dashboard') }}" class="btn btn-secondary py-2 px-5 ms-2">Torna alla Dashboard</a>
            <form action="{{ url_for('auth.logout') }}" method="POST">
                <button type="submit" class="btn btn-danger py-2 px-5">Logout</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Collega il file JavaScript esterno -->
    <script src="{{ url_for('static', filename='js/rider_track_optimal_routes.js') }}"></script>
</body>
</html>
